[project]
name = "transnoise"
version = "0.1.0"
description = "Speech denoising: data pipeline, evaluation, and models"
readme = "README.md"
authors = [
    { name = "Morindill", email = "Morindill02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.scripts]
transnoise = "transnoise.cli:main"

[tool.uv]
default-groups = ["eval", "eval-pesq"]  # 直接 uv sync 就装齐；单独 uv sync --group eval 会把 pesq 当成多余的包卸掉

[dependency-groups]
# 评测核心：只用 numpy 系的库 + onnxruntime（DNSMOS），不装任何深度学习框架
# 用 GPU 版（与 CPU 版互斥）；[cuda,cudnn] 自带 CUDA 13 / cuDNN 9 运行库，系统只需 NVIDIA 驱动（已有，CUDA 13.5）
eval = [
    "onnxruntime-gpu[cuda,cudnn]>=1.27",
    "pystoi>=0.4",
]
# PESQ 只有源码包，需要 C 编译器（sudo apt install build-essential）；没装时评测的 PESQ 列记为 NaN（并打印警告）
eval-pesq = [
    "pesq>=0.0.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
