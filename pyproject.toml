[project]
name = "transnoise"
version = "0.1.0"
description = "Speech denoising: data pipeline, evaluation, and models"
readme = "README.md"
authors = [
    { name = "Morindill", email = "Morindill02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.scripts]
transnoise = "transnoise.cli:main"

[tool.uv]
default-groups = ["eval", "eval-pesq"]  # a plain uv sync installs everything; uv sync --group eval alone would uninstall pesq as an extra package

[dependency-groups]
# Evaluation core: numpy-based libraries + onnxruntime (DNSMOS), no deep-learning framework
# The GPU build (mutually exclusive with the CPU build); [cuda,cudnn] ships the CUDA 13 / cuDNN 9 runtime libraries, so the system only needs the NVIDIA driver
eval = [
    "onnxruntime-gpu[cuda,cudnn]>=1.27",
    "pystoi>=0.4",
]
# PESQ is source-only and needs a C compiler (sudo apt install build-essential); without it the evaluation records PESQ as NaN (and prints a warning)
eval-pesq = [
    "pesq>=0.0.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
