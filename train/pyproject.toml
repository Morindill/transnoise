# Training environment: Keras 3 + TensorFlow backend. A separate uv environment; do not mix it with the main project (evaluation uses onnxruntime-gpu, CUDA 13):
# tensorflow[and-cuda] brings the CUDA 12 nvidia-*-cu12 libraries, which may overwrite onnxruntime-gpu's CUDA 13 libraries if both live in one environment.
# Usage: uv sync --project train      Run: uv run transnoise train|infer|export|check|tensorboard (from the main environment; it switches to this one automatically)
[project]
name = "transnoise-train"
version = "0"
requires-python = ">=3.12,<3.14"   # TF 2.21 supports Python 3.10-3.13; the main project requires >=3.12
dependencies = [
    "transnoise",                          # this repository (data pipeline, model code), without the eval dependency group
    "tensorflow[and-cuda]>=2.21,<2.22",      # 2.21.0 is the current stable release; 2.22 is still an rc. [and-cuda] brings CUDA 12 / cuDNN 9, the system only needs the driver
    "keras>=3.12",                           # TF 2.21 requires keras>=3.12
    "tensorboard",                           # training curves (no longer bundled since TF 2.21); without it the training script writes only CSV
    "tqdm",                                  # training progress bar; without it no bar is shown, everything else works as usual
]

[tool.uv]
package = false

[tool.uv.sources]
transnoise = { path = "..", editable = true }
