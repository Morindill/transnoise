# Training hyperparameters. Used only in the train environment (Keras + TensorFlow). The loss and optimizer follow DFN3's config.ini;
# the learning-rate values come from DFN3 (a GRU architecture) and were not tuned separately for the Conformer.

[run]
name = "baseline"        # checkpoint directory = data/checkpoints/<name>/
seed = 0

[batch]
crop_seconds = 3.0       # training segment length (DFN3 also uses 3 seconds)
batch_size = 32          # measured with the model.toml of the time (RTX 4070 SUPER, 3 s segments, XLA): batch 32 is 1.2 GB at about 800 clips/s, batch 64 is 2.4 GB at about 810 clips/s (speed is saturated). See train/measure_batch.py

[loss]
gamma = 0.3              # magnitude compression exponent: |X|^gamma
fft_sizes = [256, 512, 1024, 2048]   # multi-resolution, hop = fft/4
weight_mag = 500.0       # MSE on the compressed magnitude
weight_complex = 500.0   # MSE on the compressed complex spectrum (with phase)

[optim]
peak_lr = 2.5e-3
min_lr = 1e-6
warmup_steps = 2000      # linear warmup to peak_lr, then cosine decay to min_lr
total_steps = 100000
weight_decay = 0.01      # not applied to bias / LayerNorm / relative position bias
beta2 = 0.98
clip_norm = 1.0          # global gradient-norm clipping

[checkpoint]                # stored in data/checkpoints/<run.name>/
every_steps = 1000
keep_last = 3            # how many recent checkpoints to keep on a rolling basis; best is stored separately

[data]                   # online mixing (src/transnoise/training/dataset.py): every step draws speech x noise x (RIR) x SNR on the spot, nothing is pre-mixed
p_reverb = 0.15          # fraction of reverberant samples (among samples with speech); their target is "reverberant clean speech" (denoising only, consistent with the reverb test set)
p_noise_only = 0.20      # fraction of noise-only samples with no speech: target all zeros, loss bandwidth is the full band; noise level = the drawn speech level - SNR, distributed like the noise level of mixed samples
p_clean = 0.10           # fraction of clean-speech-only samples with no noise: target = input
p_silence = 0.04         # fraction of all-zero-input samples: target all zeros
snr_min = -5.0           # SNR is drawn uniformly in [snr_min, snr_max] (dB, over the whole-segment power)
snr_max = 40.0
speech_db_min = -40.0    # overall level of the clean speech (dBFS RMS), drawn uniformly in this range: the model's ERB feature uses a fixed dB offset, so it must have seen all volumes
speech_db_max = -15.0
workers = 20             # number of data processes (the machine has 28 logical cores; leave room for the main process and TF threads)
prefetch = 16             # how many batches to prepare ahead (about 74 MB each)
val_batches = 16         # the validation set is a fixed 16 batches (fixed seed, the same batches at every evaluation)

[loop]                   # training loop (training/run.py)
log_every = 100          # print/record every this many steps
eval_every = 1000        # evaluate on the fixed validation set every this many steps (raw and EMA weights once each); best/ is saved when EMA is better
ema_decay = 0.999        # weight moving average; evaluation and export use the EMA weights (the decay ramps up as (1+t)/(10+t) in the first steps, so it is not held back by the initial values)
nan_patience = 5         # roll back to the previous checkpoint after this many consecutive steps with NaN/Inf loss/gradients (those steps are skipped, no update)
max_rollbacks = 3        # stop with an error after more than this many rollbacks
