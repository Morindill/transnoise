# Evaluation configuration: only test sets, metrics and resource locations. The evaluation interface is fixed:
#   input = a test set + a directory of enhanced wavs (48 kHz mono, files named <id>.wav), output = one row of scores per clip.
# The evaluation does not know which model produced the wavs; each model's inference tool is models/<name>/run.py, a one-off tool that is not part of the evaluation.

[assets]
dnsmos_p835 = "data/eval/assets/dnsmos/sig_bak_ovr.onnx"   # DNSMOS P.835 (SIG/BAK/OVRL), needs onnxruntime only

[metrics]
metric_sr = 16000           # PESQ, STOI and DNSMOS are all computed at 16 kHz; SI-SDR at 48 kHz
max_lag_ms = 500            # search range (cross-correlation) when estimating a model's delay; every model "aligns itself", no model-internal delay compensation is used

# Test sets: use only the speech/noise/RIRs with split=test in the index, a fixed seed, generated once and never changed afterwards.
# Speech is drawn round-robin by "source" (a similar number per source) so reports can be sliced by source; SNRs cycle through snrs, so every level gets the same count.
# SNR is computed over the whole-segment power. With reverb=true, speech is first convolved with an RIR and the reference is "reverberant clean speech" (only denoising is evaluated, not dereverberation).
[testsets.noise]
reverb = false
n_per_lang = 300
snrs = [-5, 0, 5, 10, 15, 20]
min_duration = 3.0
max_duration = 10.0
seed = 0

[testsets.reverb]
reverb = true
n_per_lang = 300
snrs = [-5, 0, 5, 10, 15, 20]
min_duration = 3.0
max_duration = 10.0
seed = 1
