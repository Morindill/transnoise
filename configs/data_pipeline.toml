# Data pipeline parameters. Paths (the data/ directory) are handled by paths.py; the list of data sources is in registry.py.

[download]
conns = 32           # concurrent connections per file (overridable with --conns on the command line)
chunk_mb = 32       # segment size; changing it invalidates the resume progress in existing .state files
block_mb = 1        # bytes per read
retries = 6

[bandwidth]
# Spectral roll-off threshold: the highest frequency above "mean of 200-3000 Hz + floor_db". Not calibrated on real data.
floor_db = -50
tier_a_hz = 19000   # >= this is tier A (full band)
tier_b_hz = 10000   # >= this is tier B, otherwise tier C

[clean]
min_duration = 1.0          # seconds; speech and noise
rir_min_duration = 0.05
long_noise_chunk_sec = 60   # how long the segments are for long recordings that set a channel (e.g. WHAM!); a tail shorter than half a segment is merged into the last one
speech_max_clip_ratio = 0.001

[clean.min_rms_db]          # dBFS; anything below is judged silent
speech = -60
noise = -70

[split]
val = 0.15          # speech is split by speaker, noise by source-file hash; the rest is train
test = 0.2

[stage]
workers = 32         # number of decode/resample processes; 0 = CPU cores - 2, at most 16

[raw_sw]
chunk_sec = 30      # how long the segments cut from a long .sw file are
block = 20          # how many consecutive segments share one split key, so neighboring segments do not land in different sets
