# MossFormer2_SE_48K (the clearvoice pip package of ClearerVoice-Studio).
# clearvoice pins numpy<2, librosa==0.10.2.post1, opencv-python==4.10.0.84 and more, so it needs its own environment.
# On Linux the PyPI torch ships with CUDA by default; no extra index configuration needed. Usage: uv sync --project models/mossformer2
[project]
name = "model-mossformer2"
version = "0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "clearvoice==0.1.2",
    "soundfile",
]

[tool.uv]
package = false
