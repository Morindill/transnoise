# RNNoise (pyrnnoise: ships a prebuilt manylinux wheel, no compiler needed).
# A separate uv environment; do not mix it with the main project. Usage: uv sync --project models/rnnoise
[project]
name = "model-rnnoise"
version = "0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyrnnoise",
    "soundfile",
    "numpy",
]

[tool.uv]
package = false
